/* =========================================================

const STARTING_INVOICE_NUMBER = 11260;

const INVOICE_STORAGE_KEY = "invoiceRecords";

let currentCompany =

let editingInvoiceNumber = null;

let currentDocumentType = "invoice";

/* =========================================================
   INVOICE NUMBER
========================================================= */

function getInvoiceRecords() {

    try {

        return JSON.parse(
            localStorage.getItem(
                INVOICE_STORAGE_KEY
            ) || "[]"
        );

    } catch (error) {

        console.error(
            "Unable to read invoice records:",
            error
        );

        return [];

    }
}


function saveInvoiceRecords(records) {

    localStorage.setItem(
        INVOICE_STORAGE_KEY,
        JSON.stringify(records)
    );
}


/*
    Determine the highest actual invoice number
    already saved in history.
*/

function getHighestInvoiceNumber() {

    const records =
        getInvoiceRecords();

    let highest =
        STARTING_INVOICE_NUMBER - 1;


    records.forEach(record => {

        if (
            record.type !== "credit_note" &&
            record.invoiceNumber
        ) {

            const number =
                parseInt(
                    record.invoiceNumber
                );


            if (
                !isNaN(number) &&
                number > highest
            ) {

                highest = number;

            }
        }

    });


    return highest;
}


function getNextInvoiceNumber() {

    const stored =
        parseInt(
            localStorage.getItem(
                "invoiceNumber"
            ) || "0"
        );


    const highest =
        getHighestInvoiceNumber();


    let next =
        Math.max(
            STARTING_INVOICE_NUMBER,
            stored,
            highest
        );


    return next;
}


let invoiceNumber =

/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(button) {

    const row =
        button.closest("tr");


    if (row) {
        row.remove();
    }


    calculateTotals();
}


/* =========================================================
   CALCULATE TOTALS
========================================================= */

function calculateTotals() {

    let total = 0;


    const rows =
        document.querySelectorAll(
            "#itemsBody tr"
        );


    rows.forEach(row => {

        const qty =
            parseFloat(
                row.querySelector(
                    ".qty"
                ).value
            ) || 0;


        const price =
            parseFloat(
                row.querySelector(
                    ".price"
                ).value
            ) || 0;


        const amount =
            qty * price;


        row.querySelector(
            ".amount"
        ).textContent =
            "R " +
            amount.toFixed(2);


        total += amount;

    });


    document.getElementById(
        "subtotal"
    ).textContent =
        "R " +
        total.toFixed(2);


    document.getElementById(
        "grandTotal"
    ).textContent =
        "R " +
        total.toFixed(2);
}


/* =========================================================
   COLLECT CURRENT INVOICE
========================================================= */

function collectCurrentInvoice() {

    const items = [];


    document
        .querySelectorAll(
            "#itemsBody tr"
        )
        .forEach(row => {

            const qty =
                parseFloat(
                    row.querySelector(
                        ".qty"
                    ).value
                ) || 0;


            const price =
                parseFloat(
                    row.querySelector(
                        ".price"
                    ).value
                ) || 0;


            const code =
                row.querySelector(
                    ".code"
                ).value;


            const description =
                row.querySelector(
                    ".description"
                ).value;


            items.push({

                qty: qty,

                code: code,

                description: description,

                price: price,

                amount:
                    qty * price

            });

        });


    const total =
        items.reduce(
            (sum, item) =>
                sum + item.amount,
            0
        );


    return {

        invoiceNumber:
            document.getElementById(
                "invoiceNumber"
            ).textContent,

        type:
            currentDocumentType,

        company:
            currentCompany,

        invoiceDate:
            document.getElementById(
                "invoiceDate"
            ).value,

        dueDate:
            document.getElementById(
                "dueDate"
            ).value,

        customer: {

            name:
                document.getElementById(
                    "customerName"
                ).value,

            company:
                document.getElementById(
                    "customerCompany"
                ).value,

            phone:
                document.getElementById(
                    "customerPhone"
                ).value,

            email:
                document.getElementById(
                    "customerEmail"
                ).value,

            address:
                document.getElementById(
                    "customerAddress"
                ).value

        },

        items: items,

        subtotal: total,

        total: total,

        status:
            "issued",

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };
}

========================================================= */

function saveCustomer() {

    const name =
        document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Please enter a customer name."
        );

        return;
    }


    const customer = {

        name: name,

        company:
            document.getElementById(
                "customerCompany"
            ).value,

        phone:
            document.getElementById(
                "customerPhone"
            ).value,

        email:
            document.getElementById(
                "customerEmail"
            ).value,

        address:
            document.getElementById(
                "customerAddress"
            ).value
    };


    let customers =
        JSON.parse(
            localStorage.getItem(
                "customers"
            ) || "[]"
        );


    const existing =
        customers.findIndex(
            c =>
                c.name.toLowerCase() ===
                name.toLowerCase()
        );


    if (existing >= 0) {

        customers[existing] =
            customer;

    } else {

        customers.push(customer);

    }


    localStorage.setItem(
        "customers",
        JSON.stringify(
            customers
        )
    );


    loadCustomers();


    alert(
        "Customer saved."
    );
}

            );

    );
}

/* =========================================================
   SAVE ISSUED INVOICE
========================================================= */

function saveIssuedInvoice(
    invoice
) {

    const records =
        getInvoiceRecords();


    const existingIndex =
        records.findIndex(
            record =>
                record.type === "invoice" &&
                record.invoiceNumber ===
                    invoice.invoiceNumber
        );


    if (
        existingIndex >= 0
    ) {

        const existing =
            records[
                existingIndex
            ];


        invoice.createdAt =
            existing.createdAt ||
            invoice.createdAt;


        invoice.updatedAt =
            new Date().toISOString();


        invoice.status =
            existing.status ===
            "credited"
                ? "credited"
                : "issued";


        records[
            existingIndex
        ] = invoice;

    } else {

        records.push(
            invoice
        );

    }


    saveInvoiceRecords(
        records
    );


    updateInvoiceHistory();


    return invoice;
}


/* =========================================================
   GENERATE PDF
========================================================= */

function generatePDF() {

    let invoice =
        collectCurrentInvoice();


    /*
        Editing an existing invoice means
        the original reference must be preserved.
    */

    if (
        editingInvoiceNumber
    ) {

        invoice.invoiceNumber =
            editingInvoiceNumber;

    }


    /*
        Credit note mode.
    */

    if (
        currentDocumentType ===
        "credit_note"
    ) {

        invoice.type =
            "credit_note";

        invoice.invoiceNumber =
            "CN-" +
            creditingInvoiceNumber;

        invoice.status =
            "issued";

        invoice.creditOf =
            creditingInvoiceNumber;

    } else {

        invoice.type =
            "invoice";

    }


    preparePrintInvoice(
        invoice
    );


    /*
        Save invoice before opening
        the browser print dialog.
    */

    if (
        invoice.type ===
        "invoice"
    ) {

        saveIssuedInvoice(
            invoice
        );

    } else {

        saveCreditNote(
            invoice
        );

    }


    const company =
        companies[
            currentCompany
        ];


    const originalTitle =
        document.title;


    document.title =
        company.displayName +
        " - " +
        invoice.invoiceNumber;


    window.print();


    setTimeout(
        function() {

            document.title =
                originalTitle;

        },
        1000
    );
}


/* =========================================================
   SAVE CREDIT NOTE
========================================================= */

function saveCreditNote(
    creditNote
) {

    const records =
        getInvoiceRecords();


    const existing =
        records.find(
            record =>
                record.type ===
                    "credit_note" &&
                record.invoiceNumber ===
                    creditNote.invoiceNumber
        );


    if (existing) {

        alert(
            "A credit note already exists for this invoice."
        );

        return;

    }


    records.push(
        creditNote
    );


    /*
        Mark original invoice as credited.
    */

    const original =
        records.find(
            record =>
                record.type ===
                    "invoice" &&
                record.invoiceNumber ===
                    creditNote.creditOf
        );


    if (original) {

        original.status =
            "credited";

        original.updatedAt =
            new Date().toISOString();

    }


    saveInvoiceRecords(
        records
    );


    updateInvoiceHistory();
}


/* =========================================================
   CREDIT AN INVOICE
========================================================= */

function creditInvoice(
    invoiceNumber
) {

    const records =
        getInvoiceRecords();


    const invoice =
        records.find(
            record =>
                record.type ===
                    "invoice" &&
                record.invoiceNumber ===
                    invoiceNumber
        );


    if (!invoice) {

        alert(
            "Invoice could not be found."
        );

        return;
    }


    if (
        invoice.status ===
        "credited"
    ) {

        alert(
            "This invoice has already been credited."
        );

        return;
    }


    const confirmed =
        confirm(
            "Create a full credit note for invoice " +
            invoiceNumber +
            "?\n\n" +
            "The original invoice will remain in your history."
        );


    if (!confirmed) {
        return;
    }


    /*
        Load the invoice into the form.
    */

    loadInvoiceIntoForm(
        invoice
    );


    creditingInvoiceNumber =
        invoiceNumber;


    currentDocumentType =
        "credit_note";


    /*
        Negative values are used on
        the credit note.
    */

    document
        .querySelectorAll(
            "#itemsBody tr"
        )
        .forEach(
            row => {

                const price =
                    row.querySelector(
                        ".price"
                    );


                if (price) {

                    price.value =
                        -Math.abs(
                            parseFloat(
                                price.value
                            ) || 0
                        );

                }

            }
        );


    calculateTotals();


    updateInvoiceModeDisplay();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    alert(
        "Credit note prepared. Review it, then click Generate PDF."
    );
}


/* =========================================================
   LOAD INVOICE INTO FORM
========================================================= */

function loadInvoiceIntoForm(
    invoice
) {

    currentCompany =
        invoice.company ||
        "impression";


    switchCompany(
        currentCompany
    );


    document.getElementById(
        "invoiceNumber"
    ).textContent =
        invoice.invoiceNumber;


    document.getElementById(
        "invoiceDate"
    ).value =
        invoice.invoiceDate || today;


    document.getElementById(
        "dueDate"
    ).value =
        invoice.dueDate || today;


    document.getElementById(
        "customerName"
    ).value =
        invoice.customer.name || "";


    document.getElementById(
        "customerCompany"
    ).value =
        invoice.customer.company || "";


    document.getElementById(
        "customerPhone"
    ).value =
        invoice.customer.phone || "";


    document.getElementById(
        "customerEmail"
    ).value =
        invoice.customer.email || "";


    document.getElementById(
        "customerAddress"
    ).value =
        invoice.customer.address || "";


    const tbody =
        document.getElementById(
            "itemsBody"
        );


    tbody.innerHTML = "";


    if (
        invoice.items &&
        invoice.items.length
    ) {

        invoice.items.forEach(
            item => {

                addItem(
                    item
                );

            }
        );

    } else {

        addItem();

    }


    calculateTotals();
}


/* =========================================================
   EDIT INVOICE
========================================================= */

function editInvoice(
    invoiceNumber
) {

    const records =
        getInvoiceRecords();


    const invoice =
        records.find(
            record =>
                record.type ===
                    "invoice" &&
                record.invoiceNumber ===
                    invoiceNumber
        );


    if (!invoice) {

        alert(
            "Invoice could not be found."
        );

        return;
    }


    if (
        invoice.status ===
        "credited"
    ) {

        alert(
            "This invoice has already been credited and cannot be edited."
        );

        return;
    }


    loadInvoiceIntoForm(
        invoice
    );


    editingInvoiceNumber =
        invoiceNumber;


    currentDocumentType =
        "invoice";


    updateInvoiceModeDisplay();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   NEW INVOICE
========================================================= */

function newInvoice() {

    if (
        !confirm(
            "Start a new invoice?"
        )
    ) {
        return;
    }


    /*
        Determine the next unused invoice number
        from the saved history.
    */

    const highest =
        getHighestInvoiceNumber();


    const nextNumber =
        Math.max(
            STARTING_INVOICE_NUMBER,
            highest + 1
        );


    localStorage.setItem(
        "invoiceNumber",
        nextNumber
    );


    location.reload();
}

    `;


    document.head.appendChild(
        style
    );


    const panel =
        document.createElement(
            "section"
        );


    panel.id =
        "invoiceHistoryPanel";


    panel.innerHTML = `

        <h2>Invoice History</h2>

        <div class="history-subtitle">
            Saved invoices and credit notes on this device.
        </div>

        <input
            type="search"
            id="invoiceHistorySearch"
            placeholder="Search invoice number, customer or company..."
            oninput="updateInvoiceHistory()"
        >

        <div id="invoiceHistoryList"></div>

    `;

        Put the history immediately before
        the printable invoice section if possible.
    */

    const printInvoice =
        document.getElementById(

        printInvoice &&

    ) {

        );

    }


    updateInvoiceHistory();
}


/* =========================================================
   UPDATE HISTORY
========================================================= */

function updateInvoiceHistory() {

    const list =
        document.getElementById(
            "invoiceHistoryList"
        );


    if (!list) {
        return;
    }


    const search =
        (
            document.getElementById(
                "invoiceHistorySearch"
            )?.value || ""
        )
        .toLowerCase()
        .trim();


    let records =
        getInvoiceRecords();


    records =
        records
            .filter(record => {

                if (!search) {
                    return true;
                }


                const customer =
                    record.customer?.name ||
                    "";


                const company =
                    companies[
                        record.company
                    ]?.name ||
                    "";


                return (

                    String(
                        record.invoiceNumber
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    customer
                        .toLowerCase()
                        .includes(search)

                    ||

                    company
                        .toLowerCase()
                        .includes(search)

                );

            })
            .sort(
                (
                    a,
                    b
                ) => {

                    return (
                        new Date(
                            b.updatedAt ||
                            b.createdAt
                        ) -
                        new Date(
                            a.updatedAt ||
                            a.createdAt
                        )
                    );

                }
            );


    if (
        records.length === 0
    ) {

        list.innerHTML = `
            <div class="history-empty">
                No saved invoices found.
            </div>
        `;

        return;
    }


    list.innerHTML =
        records
            .map(
                record =>
                    renderHistoryItem(
                        record
                    )
            )
            .join("");
}


/* =========================================================
   RENDER HISTORY ITEM
========================================================= */

function renderHistoryItem(
    record
) {

    const company =
        companies[
            record.company
        ] ||
        companies.impression;


    const isCredit =
        record.type ===
        "credit_note";


    const status =
        record.status ||
        "issued";


    let statusClass =
        "history-status-issued";


    let statusText =
        "Issued";


    if (
        status ===
        "credited"
    ) {

        statusClass =
            "history-status-credited";

        statusText =
            "Credited";

    }


    if (isCredit) {

        statusClass =
            "history-status-credit";

        statusText =
            "Credit Note";

    }


    const customer =
        record.customer?.name ||
        "No customer";


    const total =
        Number(
            record.total || 0
        );


    return `

        <div class="history-item">

            <div class="history-header">

                <div>

                    <div class="history-reference">
                        ${escapeHtml(
                            record.invoiceNumber
                        )}
                    </div>

                    <div class="history-customer">
                        ${escapeHtml(
                            customer
                        )}
                    </div>

                </div>

                <div>
                    <span
                        class="history-status ${statusClass}"
                    >
                        ${statusText}
                    </span>
                </div>

            </div>


            <div class="history-meta">

                ${escapeHtml(
                    company.name
                )}

                &nbsp; • &nbsp;

                ${formatDate(
                    record.invoiceDate
                )}

            </div>


            ${
                isCredit
                    ? `
                        <div class="history-meta">
                            Credit for invoice
                            ${escapeHtml(
                                record.creditOf
                            )}
                        </div>
                    `
                    : ""
            }


            <div class="history-total">

                R ${total.toFixed(2)}

            </div>


            <div class="history-actions">

                ${
                    isCredit
                        ? `
                            <button
                                type="button"
                                class="history-open"
                                onclick="openSavedDocument('${escapeAttribute(record.invoiceNumber)}')"
                            >
                                Open
                            </button>
                        `
                        : `
                            <button
                                type="button"
                                class="history-open"
                                onclick="editInvoice('${escapeAttribute(record.invoiceNumber)}')"
                            >
                                Edit
                            </button>

                            ${
                                status ===
                                "credited"
                                    ? `
                                        <button
                                            type="button"
                                            class="history-disabled"
                                            disabled
                                        >
                                            Already Credited
                                        </button>
                                    `
                                    : `
                                        <button
                                            type="button"
                                            class="history-credit"
                                            onclick="creditInvoice('${escapeAttribute(record.invoiceNumber)}')"
                                        >
                                            Credit Invoice
                                        </button>
                                    `
                            }
                        `
                }

            </div>

        </div>

    `;
}


/* =========================================================
   OPEN SAVED DOCUMENT
========================================================= */

function openSavedDocument(
    documentNumber
) {

    const records =
        getInvoiceRecords();


    const record =
        records.find(
            item =>
                item.invoiceNumber ===
                documentNumber
        );


    if (!record) {

        alert(
            "Document could not be found."
        );

        return;
    }


    loadInvoiceIntoForm(
        record
    );


    editingInvoiceNumber =
        record.type ===
            "invoice"
            ? record.invoiceNumber
            : null;


    currentDocumentType =
        record.type;


    updateInvoiceModeDisplay();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   MODE DISPLAY
========================================================= */

function updateInvoiceModeDisplay() {

    let banner =
        document.getElementById(
            "invoiceModeBanner"
        );


    if (!banner) {

        banner =
            document.createElement(
                "div"
            );


        banner.id =
            "invoiceModeBanner";


        banner.className =
            "invoice-mode-banner";


        const invoiceNumberElement =
            document.getElementById(
                "invoiceNumber"
            );


        if (
            invoiceNumberElement &&
            invoiceNumberElement.parentNode
        ) {

            invoiceNumberElement.parentNode.insertBefore(
                banner,
                invoiceNumberElement
            );

        } else {

            document.body.prepend(
                banner
            );

        }

    }


    if (
        currentDocumentType ===
        "credit_note"
    ) {

        banner.textContent =
            "CREDIT NOTE MODE - Credit for invoice " +
            creditingInvoiceNumber;

        banner.classList.add(
            "active"
        );


        document.getElementById(
            "invoiceNumber"
        ).textContent =
            "CN-" +
            creditingInvoiceNumber;


        return;
    }


    if (
        editingInvoiceNumber
    ) {

        banner.textContent =
            "EDITING INVOICE " +
            editingInvoiceNumber +
            " - The invoice number will remain unchanged.";

        banner.classList.add(
            "active"
        );


        document.getElementById(
            "invoiceNumber"
        ).textContent =
            editingInvoiceNumber;


        return;
    }


    banner.classList.remove(
        "active"
    );


    document.getElementById(
        "invoiceNumber"
    ).textContent =
        String(
            invoiceNumber
        ).padStart(
            5,
            "0"
        );
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const parts =
        dateString.split("-");


    if (
        parts.length !== 3
    ) {
        return dateString;
    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );
}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            "&quot;"
        );
}

</script>
