```html
<script>

/* =========================================================
   TRADING COMPANIES
========================================================= */

const companies = {
    impression: {
        name: "Impression Solutions",
        displayName: "IMPRESSION SOLUTIONS",
        legalName: "Impression Solutions (PTY) LTD",
        logo: "icon.png",
        address: "17 Park Drive, Mulbarton, Johannesburg",
        phone: "Tel: 071 895 1445",
        footer: "Impression Solutions (PTY) LTD"
    },

    weekend: {
        name: "The Weekend Detailer",
        displayName: "THE WEEKEND DETAILER",
        legalName: "The Weekend Detailer",
        logo: "weekend-detailer.png",
        address: "17 Park Drive, Mulbarton, Johannesburg",
        phone: "Tel: 071 895 1445",
        footer: "The Weekend Detailer"
    }
};


/* =========================================================
   CURRENT COMPANY
========================================================= */

let currentCompany =
    localStorage.getItem("currentCompany") || "impression";


function switchCompany(companyKey) {

    if (!companies[companyKey]) {
        companyKey = "impression";
    }

    currentCompany = companyKey;

    localStorage.setItem(
        "currentCompany",
        currentCompany
    );

    const company = companies[currentCompany];

    document.getElementById("companySelect").value =
        currentCompany;

    /* Screen */

    document.getElementById("companyLogo").src =
        company.logo;

    document.getElementById("companyLogo").alt =
        company.name;

    document.getElementById("companyName").textContent =
        company.name;

    document.getElementById("companyLegalName").textContent =
        company.legalName;

    document.getElementById("companyAddress").textContent =
        company.address;

    document.getElementById("companyPhone").textContent =
        company.phone;


    /* Printable invoice */

    document.getElementById("printCompanyLogo").src =
        company.logo;

    document.getElementById("printCompanyLogo").alt =
        company.name;

    document.getElementById("printCompanyName").textContent =
        company.displayName;

    document.getElementById("printCompanyLegalName").textContent =
        company.legalName;

    document.getElementById("printCompanyAddress").textContent =
        company.address;

    document.getElementById("printCompanyPhone").textContent =
        company.phone;

    document.getElementById("printFooterCompany").textContent =
        company.footer;
}


/* =========================================================
   INVOICE NUMBER
   STARTING NUMBER: 11260
========================================================= */

const STARTING_INVOICE_NUMBER = 11260;

let storedInvoiceNumber =
    parseInt(
        localStorage.getItem("invoiceNumber") || "0"
    );


/*
    If an old number is below 11260,
    automatically move the sequence to 11260.
*/

if (
    isNaN(storedInvoiceNumber) ||
    storedInvoiceNumber < STARTING_INVOICE_NUMBER
) {
    storedInvoiceNumber = STARTING_INVOICE_NUMBER;

    localStorage.setItem(
        "invoiceNumber",
        storedInvoiceNumber
    );
}


let invoiceNumber = storedInvoiceNumber;


document.getElementById("invoiceNumber").textContent =
    String(invoiceNumber).padStart(5, "0");


/* =========================================================
   DATES
========================================================= */

const today =
    new Date().toISOString().split("T")[0];


document.getElementById("invoiceDate").value =
    today;

document.getElementById("dueDate").value =
    today;


/* =========================================================
   ADD ITEM
========================================================= */

function addItem() {

    const tbody =
        document.getElementById("itemsBody");

    const row =
        document.createElement("tr");

    row.innerHTML = `
        <td>
            <input
                type="number"
                class="qty"
                value="1"
                min="0"
                oninput="calculateTotals()"
            >
        </td>

        <td>
            <input
                type="text"
                class="code"
            >
        </td>

        <td>
            <input
                type="text"
                class="description"
            >
        </td>

        <td>
            <input
                type="number"
                class="price"
                value="0"
                min="0"
                step="0.01"
                oninput="calculateTotals()"
            >
        </td>

        <td class="amount">
            R 0.00
        </td>

        <td>
            <button
                type="button"
                class="danger"
                onclick="removeItem(this)"
            >
                Remove
            </button>
        </td>
    `;

    tbody.appendChild(row);

    calculateTotals();
}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(button) {

    const row =
        button.closest("tr");

    if (row) {
        row.remove();
    }

    calculateTotals();
}


/* =========================================================
   CALCULATE TOTALS
========================================================= */

function calculateTotals() {

    let total = 0;

    const rows =
        document.querySelectorAll("#itemsBody tr");


    rows.forEach(row => {

        const qty =
            parseFloat(
                row.querySelector(".qty").value
            ) || 0;


        const price =
            parseFloat(
                row.querySelector(".price").value
            ) || 0;


        const amount =
            qty * price;


        row.querySelector(".amount").textContent =
            "R " + amount.toFixed(2);


        total += amount;

    });


    document.getElementById("subtotal").textContent =
        "R " + total.toFixed(2);


    document.getElementById("grandTotal").textContent =
        "R " + total.toFixed(2);
}


/* =========================================================
   SAVE CUSTOMER
========================================================= */

function saveCustomer() {

    const name =
        document
            .getElementById("customerName")
            .value
            .trim();


    if (!name) {

        alert(
            "Please enter a customer name."
        );

        return;
    }


    const customer = {

        name: name,

        company:
            document.getElementById(
                "customerCompany"
            ).value,

        phone:
            document.getElementById(
                "customerPhone"
            ).value,

        email:
            document.getElementById(
                "customerEmail"
            ).value,

        address:
            document.getElementById(
                "customerAddress"
            ).value
    };


    let customers =
        JSON.parse(
            localStorage.getItem(
                "customers"
            ) || "[]"
        );


    const existing =
        customers.findIndex(
            c =>
                c.name.toLowerCase() ===
                name.toLowerCase()
        );


    if (existing >= 0) {

        customers[existing] =
            customer;

    } else {

        customers.push(customer);

    }


    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );


    loadCustomers();


    alert(
        "Customer saved."
    );
}


/* =========================================================
   LOAD CUSTOMERS
========================================================= */

function loadCustomers() {

    const select =
        document.getElementById(
            "customerSelect"
        );


    select.innerHTML =
        '<option value="">-- New Customer --</option>';


    const customers =
        JSON.parse(
            localStorage.getItem(
                "customers"
            ) || "[]"
        );


    customers.forEach(
        (customer, index) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                customer.name +
                (
                    customer.company
                        ? " - " +
                          customer.company
                        : ""
                );


            select.appendChild(
                option
            );

        }
    );
}


/* =========================================================
   SELECT CUSTOMER
========================================================= */

document
    .getElementById("customerSelect")
    .addEventListener(
        "change",
        function() {

            if (this.value === "") {
                return;
            }


            const customers =
                JSON.parse(
                    localStorage.getItem(
                        "customers"
                    ) || "[]"
                );


            const customer =
                customers[this.value];


            if (!customer) {
                return;
            }


            document.getElementById(
                "customerName"
            ).value =
                customer.name || "";


            document.getElementById(
                "customerCompany"
            ).value =
                customer.company || "";


            document.getElementById(
                "customerPhone"
            ).value =
                customer.phone || "";


            document.getElementById(
                "customerEmail"
            ).value =
                customer.email || "";


            document.getElementById(
                "customerAddress"
            ).value =
                customer.address || "";

        }
    );


/* =========================================================
   DELETE CUSTOMER
========================================================= */

function deleteCustomer() {

    const select =
        document.getElementById(
            "customerSelect"
        );


    if (select.value === "") {

        alert(
            "Select a saved customer first."
        );

        return;
    }


    let customers =
        JSON.parse(
            localStorage.getItem(
                "customers"
            ) || "[]"
        );


    customers.splice(
        parseInt(select.value),
        1
    );


    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );


    loadCustomers();


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "customerCompany"
    ).value = "";


    document.getElementById(
        "customerPhone"
    ).value = "";


    document.getElementById(
        "customerEmail"
    ).value = "";


    document.getElementById(
        "customerAddress"
    ).value = "";
}


/* =========================================================
   PREPARE PRINT INVOICE
========================================================= */

function preparePrintInvoice() {

    document.getElementById(
        "printInvoiceNumber"
    ).textContent =
        document.getElementById(
            "invoiceNumber"
        ).textContent;


    document.getElementById(
        "printInvoiceDate"
    ).textContent =
        formatDate(
            document.getElementById(
                "invoiceDate"
            ).value
        );


    document.getElementById(
        "printDueDate"
    ).textContent =
        formatDate(
            document.getElementById(
                "dueDate"
            ).value
        );


    document.getElementById(
        "printCustomerName"
    ).textContent =
        document.getElementById(
            "customerName"
        ).value;


    document.getElementById(
        "printCustomerCompany"
    ).textContent =
        document.getElementById(
            "customerCompany"
        ).value;


    document.getElementById(
        "printCustomerAddress"
    ).textContent =
        document.getElementById(
            "customerAddress"
        ).value;


    document.getElementById(
        "printCustomerPhone"
    ).textContent =
        document.getElementById(
            "customerPhone"
        ).value;


    document.getElementById(
        "printCustomerEmail"
    ).textContent =
        document.getElementById(
            "customerEmail"
        ).value;


    const printBody =
        document.getElementById(
            "printItemsBody"
        );


    printBody.innerHTML = "";


    const rows =
        document.querySelectorAll(
            "#itemsBody tr"
        );


    rows.forEach(row => {

        const qty =
            row.querySelector(
                ".qty"
            ).value;


        const code =
            row.querySelector(
                ".code"
            ).value;


        const description =
            row.querySelector(
                ".description"
            ).value;


        const price =
            parseFloat(
                row.querySelector(
                    ".price"
                ).value
            ) || 0;


        const amount =
            (parseFloat(qty) || 0) *
            price;


        const printRow =
            document.createElement(
                "tr"
            );


        printRow.innerHTML = `
            <td>${escapeHtml(qty)}</td>
            <td>${escapeHtml(code)}</td>
            <td>${escapeHtml(description)}</td>
            <td class="right">
                R ${price.toFixed(2)}
            </td>
            <td class="right">
                R ${amount.toFixed(2)}
            </td>
        `;


        printBody.appendChild(
            printRow
        );

    });


    document.getElementById(
        "printSubtotal"
    ).textContent =
        document.getElementById(
            "subtotal"
        ).textContent;


    document.getElementById(
        "printGrandTotal"
    ).textContent =
        document.getElementById(
            "grandTotal"
        ).textContent;
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }


    const parts =
        dateString.split("-");


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );
}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   PDF / PRINT
   Sets the browser document title so Chrome uses it
   as the suggested PDF filename.
========================================================= */

function generatePDF() {

    preparePrintInvoice();


    const company =
        companies[currentCompany];


    const reference =
        document.getElementById(
            "invoiceNumber"
        ).textContent;


    const originalTitle =
        document.title;


    /*
        Example:

        IMPRESSION SOLUTIONS - 11260
        THE WEEKEND DETAILER - 11261
    */

    document.title =
        company.displayName +
        " - " +
        reference;


    window.print();


    /*
        Give the print dialog time to initialise
        before restoring the original page title.
    */

    setTimeout(
        function() {

            document.title =
                originalTitle;

        },
        1000
    );
}


/* =========================================================
   NEW INVOICE
========================================================= */

function newInvoice() {

    if (
        !confirm(
            "Start a new invoice?"
        )
    ) {
        return;
    }


    let nextNumber =
        parseInt(
            localStorage.getItem(
                "invoiceNumber"
            ) || STARTING_INVOICE_NUMBER
        ) + 1;


    /*
        Safety check so the sequence can never
        accidentally drop below 11260.
    */

    if (
        nextNumber <
        STARTING_INVOICE_NUMBER
    ) {

        nextNumber =
            STARTING_INVOICE_NUMBER;

    }


    localStorage.setItem(
        "invoiceNumber",
        nextNumber
    );


    location.reload();
}


/* =========================================================
   STARTUP
========================================================= */

document.getElementById(
    "companySelect"
).value =
    currentCompany;


switchCompany(
    currentCompany
);


loadCustomers();


addItem();

</script>
